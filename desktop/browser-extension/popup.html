<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知序快速收藏</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span>ZHIXU CAPTURE</span>
        <h1>知序快速收藏</h1>
      </header>

      <section id="pairing-panel">
        <p>先在知序“本地数据”页面生成六位配对码。</p>
        <form id="pairing-form">
          <label for="pairing-code">配对码</label>
          <input id="pairing-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required />
          <button type="submit">连接本机知序</button>
        </form>
      </section>

      <section id="capture-panel" hidden>
        <p class="connection" id="connection-label">已连接</p>
        <button id="capture-page" type="button">收藏当前网页</button>
        <button id="capture-selection" class="secondary" type="button">收藏当前选区</button>
        <button id="disconnect" class="text-button" type="button">断开本机连接</button>
      </section>

      <p id="status" role="status">正在检查连接…</p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
