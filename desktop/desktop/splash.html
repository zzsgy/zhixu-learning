<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知序 · 正在启动</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        background: #eef5f1;
        color: #1f352d;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 20%, rgba(94, 151, 127, 0.13), transparent 28%),
          radial-gradient(circle at 86% 78%, rgba(205, 169, 107, 0.12), transparent 30%),
          #eef5f1;
      }

      main {
        width: min(560px, calc(100vw - 64px));
        padding: 54px 58px 48px;
        border: 1px solid rgba(49, 84, 71, 0.12);
        border-radius: 34px;
        background: rgba(249, 252, 250, 0.92);
        box-shadow: 0 28px 80px rgba(41, 72, 61, 0.12);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .mark {
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: #294b3f;
        color: #f7fbf8;
        font-family: "STSong", "SimSun", serif;
        font-size: 34px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }

      .eyebrow {
        margin: 0 0 7px;
        color: #6e857c;
        font-size: 11px;
        letter-spacing: 0.24em;
      }

      h1 {
        margin: 0;
        font-family: "STSong", "SimSun", serif;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      .message {
        margin: 42px 0 0;
        color: #445b52;
        font-size: 15px;
      }

      .progress {
        height: 4px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #dce8e2;
      }

      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #4e806c;
        animation: loading 1.25s ease-in-out infinite alternate;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 34px;
        padding-top: 24px;
        border-top: 1px solid rgba(49, 84, 71, 0.1);
        color: #70867d;
        font-size: 12px;
        text-align: center;
      }

      @keyframes loading {
        from { transform: translateX(-15%); }
        to { transform: translateX(145%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after { animation: none; width: 68%; }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="brand">
        <div class="mark" aria-hidden="true">序</div>
        <div>
          <p class="eyebrow">PERSONAL KNOWLEDGE WORKSPACE</p>
          <h1>知序</h1>
        </div>
      </div>
      <p class="message">正在连接你的本地知识库…</p>
      <div class="progress" role="progressbar" aria-label="知序启动中"></div>
      <div class="features" aria-label="知序桌面版特点">
        <span>本机数据</span>
        <span>证据可追溯</span>
        <span>专注阅读</span>
      </div>
    </main>
  </body>
</html>
